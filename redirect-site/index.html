<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document Intelligence Pipeline — Link Updated</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 2.5rem 3rem;
        max-width: 540px;
        width: 100%;
        text-align: center;
      }
      .icon { font-size: 2.5rem; margin-bottom: 1rem; }
      h1 {
        font-size: 1.4rem;
        font-weight: 700;
        color: #f8fafc;
        margin-bottom: 0.75rem;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.75rem;
      }
      a.btn {
        display: inline-block;
        background: #3b82f6;
        color: #fff;
        text-decoration: none;
        padding: 0.75rem 1.75rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: background 0.2s;
      }
      a.btn:hover { background: #2563eb; }
      .new-url {
        margin-top: 1.25rem;
        font-size: 0.8rem;
        color: #64748b;
        word-break: break-all;
      }
      .new-url a { color: #64748b; text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🔗</div>
      <h1>This project has moved</h1>
      <p>
        The <strong>Document Intelligence Pipeline</strong> has a new home.
        Please update your bookmarks and click below to visit the live demo.
      </p>
      <a class="btn" href="https://document-intelligence-pipeline.onrender.com/">
        Go to the live demo →
      </a>
      <div class="new-url">
        New URL:
        <a href="https://document-intelligence-pipeline.onrender.com/">
          document-intelligence-pipeline.onrender.com
        </a>
      </div>
    </div>
  </body>
</html>
