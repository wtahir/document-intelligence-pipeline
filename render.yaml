services:
  - type: web
    name: insurance-ai-pipeline
    runtime: python
    buildCommand: bash render_build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
    plan: free
